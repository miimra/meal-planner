services:
  meal-planner:
    build:
      context: .
      args:
        BUILD_VERSION: ${MEAL_PLANNER_VERSION:-development}
        BUILD_COMMIT: ${MEAL_PLANNER_COMMIT:-development}
        BUILD_AT: ${MEAL_PLANNER_BUILT_AT:-development}
    image: ${MEAL_PLANNER_IMAGE:-meal-planner:latest}
    container_name: meal-planner
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8091:8090"
    volumes:
      - meal-planner-pb-data:/pb/pb_data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8090/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  meal-planner-pb-data:
    external: true
