<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="0.55" stop-color="#1b2a5c"/>
      <stop offset="1" stop-color="#0a131e"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffce87"/>
      <stop offset="1" stop-color="#e2870a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#tile)"/>
  <!-- khatam: two squares crossed into the eight-point star -->
  <g fill="none" stroke="#7d86ff" stroke-width="13" opacity="0.85">
    <rect x="141" y="141" width="230" height="230" rx="6"/>
    <rect x="141" y="141" width="230" height="230" rx="6" transform="rotate(45 256 256)"/>
  </g>
  <g fill="none" stroke="#46d194" stroke-width="6" opacity="0.55">
    <rect x="181" y="181" width="150" height="150" rx="4" transform="rotate(22.5 256 256)"/>
  </g>
  <!-- the bowl at the centre of the table -->
  <path d="M167 252 h178 a89 89 0 0 1 -178 0 z" fill="url(#bowl)"/>
  <ellipse cx="256" cy="252" rx="89" ry="16" fill="#ffefd2"/>
  <!-- steam -->
  <g stroke="#ffce87" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M222 205 q14 -18 0 -36 q-14 -18 0 -36"/>
    <path d="M290 205 q14 -18 0 -36 q-14 -18 0 -36"/>
  </g>
</svg>
