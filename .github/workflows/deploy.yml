name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Production deploys are serialised and never cancelled. Every run deploys the
# current tip of main, so a run queued behind another still ships the newest
# commit, and a deployed commit always contains every earlier merge.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
      DEPLOY_VERSION_URL: ${{ vars.DEPLOY_VERSION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The key is written only to the runner's home and never echoed. The host
      # key comes from VPS_KNOWN_HOSTS, falling back to a scan of the host.
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          [ -n "$VPS_SSH_KEY" ] || { echo "The VPS_SSH_KEY secret is not set" >&2; exit 1; }
          [ -n "$VPS_HOST" ] || { echo "The VPS_HOST variable is not set" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts
            [ -s ~/.ssh/known_hosts ] || { echo "ssh-keyscan returned no host key for $VPS_HOST" >&2; exit 1; }
          fi
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
          echo "DEPLOY_HOST=${VPS_USER:-ubuntu}@$VPS_HOST" >> "$GITHUB_ENV"

      - run: ./deploy.sh
